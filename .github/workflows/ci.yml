name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned images: the -latest labels move under you and the runner warns about it.
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      # --trust lets the package's postinstall fetch the native binary; bun skips it otherwise.
      - name: Install Claude Code
        run: bun add -g --trust @anthropic-ai/claude-code@2.1.304
      - name: Validate marketplace
        run: claude plugin validate .
      - name: Validate and test each mod
        run: |
          for manifest in */.claude-plugin/plugin.json; do
            mod="${manifest%%/*}"
            echo "::group::$mod"
            claude plugin validate "$mod"
            claude plugin test "$mod"
            echo "::endgroup::"
          done
