name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned images: the -latest labels move under you and the runner warns about it.
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Checkout runs git init; naming the default branch keeps git's hint out of the log.
      - name: Configure git
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      # --trust lets the package's postinstall fetch the native binary; bun skips it otherwise.
      - name: Install Claude Code
        run: bun add -g --trust @anthropic-ai/claude-code@2.1.304
      # A validation warning fails the build, so the marketplace and each mod stay clean.
      - name: Validate marketplace
        run: |
          out="$(claude plugin validate . 2>&1)"
          echo "$out"
          if grep -q '⚠' <<<"$out"; then echo "::error::marketplace validation has warnings"; exit 1; fi
      - name: Validate and test each mod
        run: |
          for manifest in */.claude-plugin/plugin.json; do
            mod="${manifest%%/*}"
            echo "::group::$mod"
            out="$(claude plugin validate "$mod" 2>&1)"
            echo "$out"
            if grep -q '⚠' <<<"$out"; then echo "::error::$mod validation has warnings"; exit 1; fi
            claude plugin test "$mod"
            echo "::endgroup::"
          done
